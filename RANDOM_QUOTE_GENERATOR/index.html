<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qoute Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <div class="circle1"></div>
    <div class="circle2"></div>
    <div class="circle3"></div>
    <div class="card">
        <header><h1>QOUTE OF THE DAY</h1></header>
        <main><p>❝ The only limit to our realization of tommorow is our doubts of today.❞</p></main>
        <footer><span>-Franklin D.roosevelt</span></footer>
        <div class="btns">
            <button class="new-quote">New Quote</button>
            <button class="copy"><i class="ri-file-copy-line"></i>Copy</button>
        </div>
    </div>
    <script src="script.js"></script>
